# Dependencias externas fijadas (revision exacta, no ramas moviles).
# Formato: <slug> <url> <commit>
#
# El motor es Xash3D-FWGS: reimplementacion libre del engine GoldSrc capaz de
# cargar .bsp v30, .mdl v10 y .wav originales de Counter-Strike 1.5.
xash3d-fwgs  https://github.com/FWGS/xash3d-fwgs.git  a7becfdf8d134eb2ae5cd083a45c816e6b4e42fc
cs16-client  https://github.com/Velaron/cs16-client.git  a238ef131803ed7592c4ba701499027c862889ee
ReGameDLL_CS https://github.com/s1lentq/ReGameDLL_CS.git  4a50c42e85fd3778c2b7d24731c7d30c83bbab01

# Submodulos del motor que SI se pueden traer desde GitHub (los usa el build).
# Los que viven en gitlab.com (bzip2) tienen espejo en GitHub, ver fetch_sources.sh.
