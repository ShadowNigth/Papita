// config.cfg - binds por defecto estilo Counter-Strike 1.5.
// Editable desde el juego; si borras el archivo, se vuelve a esta base.

unbindall

bind "TAB"   "+showscores"
bind "ENTER" "+attack"
bind "ESCAPE" "cancelselect"
bind "SPACE" "+jump"
bind "'"     "+moveup"
bind "+"     "sizeup"
bind ","     "buyammo1"
bind "-"     "sizedown"
bind "."     "buyammo2"
bind "/"     "+movedown"
bind "0"     "slot10"
bind "1"     "slot1"
bind "2"     "slot2"
bind "3"     "slot3"
bind "4"     "slot4"
bind "5"     "slot5"
bind "6"     "slot6"
bind "7"     "slot7"
bind "8"     "slot8"
bind "9"     "slot9"
bind ";"     "+mlook"
bind "="     "sizeup"
bind "["     "radiopanel"
bind "\\"    "+speed"
bind "]"     "lastinv"
bind "`"     "toggleconsole"
bind "a"     "+moveleft"
bind "b"     "buy"
bind "c"     "radio3"
bind "d"     "+moveright"
bind "e"     "+use"
bind "f"     "impulse 100"
bind "g"     "drop"
bind "h"     "commandmenu"
bind "i"     "showbriefing"
bind "j"     "cheer"
bind "k"     "+voicerecord"
bind "l"     "adjust_crosshair"
bind "m"     "chooseteam"
bind "n"     "nightvision"
bind "o"     "buyequip"
bind "p"     "use"
bind "q"     "lastinv"
bind "r"     "+reload"
bind "s"     "+back"
bind "t"     "impulse 201"
bind "u"     "messagemode2"
bind "v"     "+moveup"
bind "w"     "+forward"
bind "x"     "radio2"
bind "y"     "messagemode"
bind "z"     "radio1"
bind "~"     "toggleconsole"
bind "ALT"   "+strafe"
bind "CAPSLOCK" "radio1"
bind "CTRL"  "+duck"
bind "F1"    "autobuy"
bind "F2"    "rebuy"
bind "F3"    "buyequip"
bind "F4"    "buy"
bind "F5"    "snapshot"
bind "F6"    "save"
bind "F7"    "load"
bind "F8"    "savequick"
bind "F9"    "loadquick"
bind "F10"   "quit"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "switchgrenade"
bind "MOUSE4" "+duck"
bind "MWHEELDOWN" "invnext"
bind "MWHEELUP"   "invprev"
