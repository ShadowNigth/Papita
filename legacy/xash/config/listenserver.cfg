// listenserver.cfg - partida local (el jugador es a la vez cliente y servidor).
// Se ejecuta despues de server.cfg cuando arrancas con "Jugar" en el menu.
hostname "PAPITA - partida local"
sv_lan 1
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
sv_aim 0

// Camara al morir: 1 = desde el cadaver, 2 = chase cam libre
mp_forcechasecam 2
mp_fadetoblack 0
