// server.cfg - preset "Counter-Strike 1.5".
// El motor ejecuta este fichero al arrancar el servidor dedicado.
// Los valores son los del CS 1.5 de 2002-2003, no los del 1.6.

// --- identidad ---
hostname "PAPITA - CS 1.5 Reforged"
sv_lan 0
sv_region 3
mp_consistency 1

// --- rondas y tiempo ---
mp_roundtime 5
mp_freezetime 6
mp_timelimit 30
mp_winlimit 0
mp_maxrounds 0
mp_c4timer 35          // el C4 del 1.5 son 35 s, no 40
mp_buytime 0.25        // 15 s de compra
mp_chattime 10
mp_fadetoblack 1
mp_forcechasecam 2
mp_forcerespawn 0

// --- economia ---
mp_startmoney 800
mp_maxmoney 16000
mp_autoteambalance 1
mp_limitteams 2
mp_hostagepenalty 2
mp_tkpunish 0
mp_autokick 1
mp_autokick_timeout 60
mp_kickpercent 0.66
mp_max_teamkills 3
mp_friendlyfire 0
mp_logmessages 1

// --- arsenal ---
mp_ammodrop 1
mp_auto_reload_weapons 0
mp_weapons_allow_map_placed 1
mp_defuser_allocation 0
mp_free_armor 0
mp_infinite_ammo 0
mp_infinite_grenades 0
mp_give_player_c4 1

// --- fisica y movimiento (los del 1.5) ---
sv_gravity 800
sv_maxspeed 320
sv_accelerate 10
sv_airaccelerate 10
sv_friction 4
sv_stopspeed 75
sv_falldamage 1
mp_falldamage 1
mp_flashlight 1
mp_footsteps 1
mp_ghostfrequency 0.1
decalfrequency 30

// --- red ---
sv_maxrate 0
sv_minrate 0
sv_timeout 65
sv_voiceenable 1
pausable 0
sv_aim 0

// --- bots (integrados en ReGameDLL; ver docs/BOTS.md) ---
// bot_add / bot_kick / bot_quota se usan desde consola.
// Necesitan un fichero .nav por mapa: ejecuta nav_generate una vez.
